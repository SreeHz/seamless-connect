# Seamless Connect Configuration
# Stored at /data/adb/seamless_connect/seamless.conf

# FTP server port
PORT=2121

# Hotspot / SoftAP interface. "auto" will auto-detect wlan0/wlan1/wlan2/ap0
IFACE="auto"

# Watchdog check interval in seconds
WATCH_INTERVAL=30

# Number of consecutive absence misses before stopping FTP server
WATCH_MISSES=3

# Root path for media scan upload detection (must end with trailing slash)
SCAN_ROOT="/sdcard/"

# Ensure ADB TCP/IP (port 5555) on boot (1 = enabled, 0 = disabled)
ENABLE_ADB_PERSIST=1
